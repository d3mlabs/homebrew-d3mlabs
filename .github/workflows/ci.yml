name: Homebrew tap CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The Bottle workflow dispatches CI on a PR branch after pushing the bottle
  # block, since its GITHUB_TOKEN push does not trigger pull_request.
  workflow_dispatch:

jobs:
  # bin/mint-ruby-formula and its library (the Bump Ruby workflow's engine).
  test-mint-ruby-formula:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Run tests
        run: ruby test/mint_ruby_formula_test.rb

  test-dev-formula:
    runs-on: macos-latest

    env:
      # Homebrew 6.0 requires third-party taps to be trusted before their
      # formulae can be built; an untrusted tap fails the build immediately
      # with no logs. This is our own tap, so allow it in CI.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: brew update

      - name: Register local tap
        run: brew tap d3mlabs/d3mlabs "$GITHUB_WORKSPACE"

      - name: Audit dev formula
        run: brew audit --strict d3mlabs/d3mlabs/dev

      - name: Install dev from tap
        run: brew install d3mlabs/d3mlabs/dev

      - name: Run dev formula tests
        run: brew test d3mlabs/d3mlabs/dev

  # The ruby@X.Y.Z family grows by itself (Bump Ruby), so the matrix is
  # read from Formula/ rather than listed here.
  list-ruby-formulae:
    runs-on: ubuntu-24.04
    outputs:
      formulae: ${{ steps.list.outputs.formulae }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: List ruby@* formulae
        id: list
        run: |
          set -euo pipefail
          json=$(ls Formula/ruby@*.rb | xargs -n1 basename | sed 's/\.rb$//' | jq -R . | jq -cs .)
          echo "formulae=$json" >> "$GITHUB_OUTPUT"
          echo "$json"

  # Bottled formulae: audit, install (pours when the bottle block is
  # present, builds otherwise) and test on both bottled platforms.
  test-ruby-formulae:
    needs: list-ruby-formulae
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.list-ruby-formulae.outputs.formulae) }}
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

    steps:
      # Checks out this repo and symlinks it in as the d3mlabs/d3mlabs tap.
      - name: Set up Homebrew with this tap
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit formula
        run: brew audit --strict "d3mlabs/d3mlabs/${{ matrix.formula }}"

      - name: Install from tap
        run: brew install "d3mlabs/d3mlabs/${{ matrix.formula }}"

      - name: Run formula tests
        run: brew test "d3mlabs/d3mlabs/${{ matrix.formula }}"
