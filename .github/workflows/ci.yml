name: Homebrew tap CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-dev-formula:
    runs-on: macos-latest

    env:
      # Homebrew 6.0 requires third-party taps to be trusted before their
      # formulae can be built; an untrusted tap fails the build immediately
      # with no logs. This is our own tap, so allow it in CI.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: brew update

      - name: Register local tap
        run: brew tap d3mlabs/d3mlabs "$GITHUB_WORKSPACE"

      - name: Audit dev formula
        run: brew audit --strict d3mlabs/d3mlabs/dev

      - name: Install dev from tap
        run: brew install d3mlabs/d3mlabs/dev

      - name: Run dev formula tests
        run: brew test d3mlabs/d3mlabs/dev

  test-clang-format-formula:
    runs-on: macos-latest

    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: brew update

      - name: Register local tap
        run: brew tap d3mlabs/d3mlabs "$GITHUB_WORKSPACE"

      - name: Audit clang-format formula
        run: brew audit --strict d3mlabs/d3mlabs/clang-format@18.1.8

      - name: Install clang-format from tap
        run: brew install d3mlabs/d3mlabs/clang-format@18.1.8

      - name: Run clang-format formula tests
        run: brew test d3mlabs/d3mlabs/clang-format@18.1.8

  # Bottled formulae: audit, install (pours when the bottle block is
  # present, builds otherwise) and test on both bottled platforms.
  test-ruby-formulae:
    strategy:
      fail-fast: false
      matrix:
        formula: ["ruby@4.0.5", "ruby@4.0.6"]
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

    steps:
      # Checks out this repo and symlinks it in as the d3mlabs/d3mlabs tap.
      - name: Set up Homebrew with this tap
        uses: Homebrew/actions/setup-homebrew@master

      - name: Audit formula
        run: brew audit --strict "d3mlabs/d3mlabs/${{ matrix.formula }}"

      - name: Install from tap
        run: brew install "d3mlabs/d3mlabs/${{ matrix.formula }}"

      - name: Run formula tests
        run: brew test "d3mlabs/d3mlabs/${{ matrix.formula }}"
